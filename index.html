<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocks</title>
    <link rel="icon" href="data:,">
    <link rel="preload" href="blocks.wasm" as="fetch" type="application/wasm" crossorigin>
    <style>
        html,
        body,
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
            -webkit-touch-callout: none; /* Disable long-press menus */
            -webkit-user-select: none;   /* Prevent text selection */
            user-select: none;           /* Standard property for text selection */
            touch-action: none;          /* Prevent default gestures */
        }

        canvas:focus {
            outline: none;               /* Hide the focus ring of the focused canvas */
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <!-- WebGL loader from the miniquad crate (js/gl.js), keep in sync when updating miniquad -->
    <script src="gl.js"></script>
    <script src="custom.js"></script>
    <script>load("blocks.wasm");</script>
</body>
</html>
